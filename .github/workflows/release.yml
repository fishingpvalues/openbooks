# This is a basic workflow to help you get started with Actions

name: Create New Release and Upload Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

# The repo's default workflow token permission is read-only, so the
# GITHUB_TOKEN used by this workflow cannot create a release without
# an explicit scope. This is the only permission this job needs.
permissions:
  contents: write

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # go1.26.6: the v5.0.0 line is built with a standard library that
          # carries no known reachable advisories (1.26.0 had 16).
          go-version: "^1.26.6"
      - run: go version

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Task
        uses: arduino/setup-task@v3.0.0

      - name: Build
        run: task release:build

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          name: Release ${{ github.ref }}
          files: |
            ./build/*
